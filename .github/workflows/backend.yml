name: Backend
on:
  push:
    paths: ['RedNote.*/**', 'RedNote.slnx', 'ServiceDefaults/**', 'Test/**', 'Directory.*.props', '.editorconfig', 'scripts/test-backend.ps1', '.github/workflows/backend.yml']
  pull_request:
    paths: ['RedNote.*/**', 'RedNote.slnx', 'ServiceDefaults/**', 'Test/**', 'Directory.*.props', '.editorconfig', 'scripts/test-backend.ps1', '.github/workflows/backend.yml']
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build RedNote.slnx --configuration Release
      - shell: pwsh
        run: ./scripts/test-backend.ps1
