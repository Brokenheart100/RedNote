name: Frontend
on:
  push:
    paths: ['Red-Book/**', '.github/workflows/frontend.yml']
  pull_request:
    paths: ['Red-Book/**', '.github/workflows/frontend.yml']

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: Red-Book
    env:
      NUXT_SESSION_PASSWORD: frontend-ci-session-password-12345678901234567890
      REDNOTE_E2E_PREVIEW: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Red-Book/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: frontend-test-report
          path: |
            Red-Book/playwright-report/
            Red-Book/test-results/
          retention-days: 7
