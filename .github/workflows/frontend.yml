name: Frontend
on:
  workflow_dispatch:
  push:
    paths:
      - 'Red-Book/**'
      - 'RedNote.Admin/**'
      - 'RedNote.Bff.Shared/**'
      - '.gitattributes'
      - '.github/workflows/frontend.yml'
  pull_request:
    paths:
      - 'Red-Book/**'
      - 'RedNote.Admin/**'
      - 'RedNote.Bff.Shared/**'
      - '.gitattributes'
      - '.github/workflows/frontend.yml'

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate ${{ matrix.app }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        app: [Red-Book, RedNote.Admin]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    env:
      NUXT_SESSION_PASSWORD: frontend-ci-session-password-12345678901234567890
      REDNOTE_E2E_PREVIEW: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            RedNote.Bff.Shared/package-lock.json
            ${{ matrix.app }}/package-lock.json
      - name: Install and build shared BFF package
        working-directory: RedNote.Bff.Shared
        run: npm ci
      - name: Install application dependencies
        run: npm ci
      - name: Lint user frontend
        if: matrix.app == 'Red-Book'
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: User frontend unit tests
        if: matrix.app == 'Red-Book'
        run: npm test
      - name: Build
        run: npm run build
      - name: Install Chromium
        if: matrix.app == 'Red-Book'
        run: npx playwright install --with-deps chromium
      - name: User frontend smoke tests with mock gateway
        if: matrix.app == 'Red-Book'
        run: npm run test:e2e
      - name: Upload browser test report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure() && matrix.app == 'Red-Book'
        with:
          name: frontend-test-report
          path: |
            Red-Book/playwright-report/
            Red-Book/test-results/
          retention-days: 7
